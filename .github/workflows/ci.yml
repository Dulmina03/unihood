name: Workspace checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, 'feat/uni-*', 'fix/uni-*', 'chore/uni-*', 'test/uni-*', 'docs/uni-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  APP_ENV: test
  ENABLE_SYNTHETIC_ACTORS: 'false'
  SYNTHETIC_ACTOR: ''
  NEXT_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned pnpm from packageManager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up tested Node and lockfile-keyed pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
      - run: pnpm check:workflows
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Isolated PostGIS integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Create synthetic runner-only configuration
        run: |
          test ! -e .env
          cp .env.example .env
      - name: Validate Compose without starting development services
        run: docker compose --env-file .env -f infra/compose.yaml --profile test config --quiet
      - run: pnpm --filter @unihood/contracts build
      - run: pnpm --filter @unihood/api build
      - run: pnpm --filter @unihood/web build
      - name: Run isolated tmpfs database, API and landing regression
        run: pnpm db:test
        env:
          TEST_LANDING_WEB: '1'

  ui:
    name: Component browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unihood/web exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/unihood-playwright
      - name: Build shared contracts before the web consumer
        run: pnpm --filter @unihood/contracts build
      - run: pnpm --filter @unihood/web build
      - name: Run existing synthetic component suite (not full product E2E)
        run: pnpm test:ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/unihood-playwright
          UI_EVIDENCE_DIR: ${{ runner.temp }}/unihood-ui-evidence
      - name: Build API for real Phase 1 browser integration
        run: pnpm --filter @unihood/api build
      - name: Prepare synthetic disposable Compose settings
        run: cp .env.example .env
      - name: Run Phase 1 guest E2E against isolated PostGIS
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/unihood-playwright
          UI_EVIDENCE_DIR: ${{ runner.temp }}/unihood-phase1-evidence
